; Fragment only: merge into an existing verified case config.ini.
; Keep its filenames, freestream, domain, boundary conditions and validated seed.
; Select a new valid seed after changing the profile coordinate model.
[lst]
method = LST_local
mode = LST_SPATIAL_MODE
adjoint = F
profile_coordinates = wall_local

[neutral]
