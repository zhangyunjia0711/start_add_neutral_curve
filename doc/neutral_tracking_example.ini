vector_tracking = T
minimum_overlap = 0.95
retry_eigenpairs = 8
eigen_error_tol = 1e-7
max_eigen_jump = 2
growth_tol = 1e-8
parameter_tol = 1e-7
max_iterations = 70
output_prefix = out/neutral
